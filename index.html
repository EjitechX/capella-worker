<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Capella</title>
<style>
  :root{ --primary:#0B5CFF; --secondary:#0E2A6B; --accent:#F5B301; }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--secondary); font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  .logo-mark{
    width:56px; height:56px; border-radius:16px;
    background:linear-gradient(135deg,var(--primary),var(--accent));
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.7; transform:scale(.94);} }
</style>
</head>
<body>

<div class="logo-mark"></div>

<script>
  const API_BASE = "https://capella-api-5c6c.drthankgod08.workers.dev";

  async function route() {
    const token = localStorage.getItem("capella_token");

    if (token) {
      try {
        const res = await fetch(API_BASE + "/auth/me", { headers: { Authorization: "Bearer " + token } });
        if (res.ok) {
          const profile = await res.json();
          if (!profile.accountActivated) {
            const role = profile.roleBusiness && !profile.roleWorker ? "business" : "worker";
            window.location.href = "capella-activation.html?role=" + role;
            return;
          }
          window.location.href = (profile.roleBusiness && !profile.roleWorker) ? "capella-business.html" : "capella-worker.html";
          return;
        }
      } catch (err) { /* fall through to onboarding/login below */ }
      localStorage.removeItem("capella_token");
    }

    window.location.href = localStorage.getItem("capella_onboarded") ? "capella-login.html" : "capella-onboarding.html";
  }

  route();
</script>

</body>
</html>
