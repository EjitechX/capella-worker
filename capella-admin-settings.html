<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capella Admin — Settings</title>
<style>
  :root{--primary:#0B5CFF;--secondary:#0E2A6B;--accent:#F5B301;--bg:#F8FAFF;--card:#fff;--line:#E6EAF2;--text:#1B2559;--muted:#6B7590;--green:#16A34A;--red:#DC2626;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);}
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:220px;background:var(--secondary);color:#fff;padding:18px 12px;flex-shrink:0;}
  .sidebar h2{font-size:15px;padding:0 8px 16px;}
  .sidebar a{display:block;padding:9px 12px;border-radius:8px;color:#C4CDE8;text-decoration:none;font-size:13px;font-weight:600;margin-bottom:2px;}
  .sidebar a.active,.sidebar a:hover{background:var(--primary);color:#fff;}
  .main{flex:1;padding:24px 30px;min-width:0;max-width:560px;}
  h1{font-size:20px;margin-bottom:4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px;}
  .field .hint{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;box-sizing:border-box;}
  .btn{background:var(--primary);color:#fff;border:none;padding:11px 18px;border-radius:9px;font-weight:700;font-size:13.5px;cursor:pointer;}
  .btn:disabled{background:var(--line);color:var(--muted);}
  .msg{font-size:12.5px;margin-top:12px;}
  .msg.ok{color:var(--green);}
  .msg.err{color:var(--red);}
  .empty{color:var(--muted);text-align:center;padding:20px;}
  @media(max-width:800px){.sidebar{display:none;}.main{padding:16px;max-width:none;}}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <h2>Capella Admin</h2>
    <a href="capella-admin-dashboard.html">Dashboard</a>
    <a href="capella-admin-users.html">Users</a>
    <a href="capella-admin-businesses.html">Businesses</a>
    <a href="capella-admin-campaigns.html">Campaigns</a>
    <a href="capella-admin-pricing.html">Task Pricing</a>
    <a href="capella-admin-disputes.html">Disputes</a>
    <a href="capella-admin-verification.html">Verification</a>
    <a href="capella-admin-fraud.html">Fraud</a>
    <a href="capella-admin-pending-transfers.html">Pending Transfers</a>
    <a href="capella-admin-affiliate-conversions.html">Affiliate Sales</a>
    <a href="capella-admin-referral-payouts.html">Referrals</a>
    <a href="capella-admin-finance.html">Finance</a>
    <a href="capella-admin-reports.html">Reports</a>
    <a class="active" href="capella-admin-settings.html">Settings</a>
  </aside>
  <main class="main">
    <h1>Platform Settings</h1>
    <div class="sub">These apply platform-wide, immediately.</div>

    <div class="card" id="formCard">
      <div class="empty">Loading…</div>
    </div>
  </main>
</div>

<script>
  const API_BASE = "https://capella-api-5c6c.drthankgod08.workers.dev";
  function escapeHtml(str) { return String(str || "").replace(/[&<>"']/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s])); }

  const FIELDS = [
    { key: "registrationFee", label: "Registration / Activation Fee (₦)", hint: "One-time fee to activate worker or business access." },
    { key: "minWithdrawal", label: "Minimum Withdrawal (₦)", hint: "Smallest amount a worker can withdraw at once." },
    { key: "referralPlatformSharePct", label: "Referral Commission (%)", hint: "Share of platform revenue paid to whoever referred a worker." },
    { key: "reservePctOfPlatformRevenue", label: "Reserve Percentage (%)", hint: "Portion of each approved task held back as locked reserve." },
    { key: "musicPlatformFeePct", label: "Music Marketplace Fee (%)", hint: "Capella's cut of each unreleased-track sale." },
    { key: "affiliatePlatformFeePct", label: "Affiliate Marketplace Fee (%)", hint: "Capella's cut of each affiliate product sale (from the business's share only, never the worker's commission)." },
  ];

  async function apiFetch(path, options = {}) {
    const res = await fetch(API_BASE + path, {
      ...options,
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + localStorage.getItem("capella_token"), ...(options.headers || {}) },
    });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  }

  async function init() {
    const token = localStorage.getItem("capella_token");
    if (!token) { window.location.href = "capella-login.html"; return; }

    const { ok, data, status } = await apiFetch("/admin/settings");
    const card = document.getElementById("formCard");

    if (!ok) {
      card.innerHTML = `<div class="empty">${status === 403 ? "Admin access required." : (data.message || "Could not load.")}</div>`;
      return;
    }

    render(data);
  }

  function render(settings) {
    const card = document.getElementById("formCard");
    card.innerHTML = FIELDS.map(f => `
      <div class="field">
        <label>${escapeHtml(f.label)}</label>
        <input type="number" id="f-${f.key}" value="${settings[f.key] ?? ''}">
        <div class="hint">${escapeHtml(f.hint)}</div>
      </div>
    `).join("") + `
      <div id="settingsMsg"></div>
      <button class="btn" id="saveBtn" onclick="saveSettings()">Save Settings</button>
    `;
  }

  window.saveSettings = async function () {
    const msgEl = document.getElementById("settingsMsg");
    const btn = document.getElementById("saveBtn");
    msgEl.innerHTML = "";

    const payload = {};
    FIELDS.forEach(f => { payload[f.key] = Number(document.getElementById(`f-${f.key}`).value); });

    btn.disabled = true;
    btn.textContent = "Saving…";

    const { ok, data } = await apiFetch("/admin/settings", { method: "POST", body: JSON.stringify(payload) });

    if (ok && data.success) {
      msgEl.innerHTML = '<div class="msg ok">Saved — changes are live now.</div>';
    } else {
      msgEl.innerHTML = `<div class="msg err">${escapeHtml(data.message || "Could not save.")}</div>`;
    }
    btn.disabled = false;
    btn.textContent = "Save Settings";
  };

  init();
</script>

</body>
</html>
