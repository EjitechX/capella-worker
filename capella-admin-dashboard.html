<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capella Admin — Dashboard</title>
<style>
  :root{--primary:#0B5CFF;--secondary:#0E2A6B;--accent:#F5B301;--bg:#F8FAFF;--card:#fff;--line:#E6EAF2;--text:#1B2559;--muted:#6B7590;--green:#16A34A;--red:#DC2626;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);}
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:220px;background:var(--secondary);color:#fff;padding:18px 12px;flex-shrink:0;}
  .sidebar h2{font-size:15px;padding:0 8px 16px;}
  .sidebar a{display:block;padding:9px 12px;border-radius:8px;color:#C4CDE8;text-decoration:none;font-size:13px;font-weight:600;margin-bottom:2px;}
  .sidebar a.active,.sidebar a:hover{background:var(--primary);color:#fff;}
  .main{flex:1;padding:24px 30px;min-width:0;}
  h1{font-size:20px;margin-bottom:4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .card .label{font-size:12px;color:var(--muted);font-weight:600;}
  .card .value{font-size:26px;font-weight:800;margin-top:6px;}
  .card.warn .value{color:#92400E;}
  .card a.link{font-size:11.5px;color:var(--primary);font-weight:700;text-decoration:none;display:block;margin-top:8px;}
  .empty{color:var(--muted);text-align:center;padding:30px;}
  @media(max-width:800px){.sidebar{display:none;}.main{padding:16px;}}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <h2>Capella Admin</h2>
    <a class="active" href="capella-admin-dashboard.html">Dashboard</a>
    <a href="capella-admin-users.html">Users</a>
    <a href="capella-admin-businesses.html">Businesses</a>
    <a href="capella-admin-campaigns.html">Campaigns</a>
    <a href="capella-admin-pricing.html">Task Pricing</a>
    <a href="capella-admin-disputes.html">Disputes</a>
    <a href="capella-admin-verification.html">Verification</a>
    <a href="capella-admin-fraud.html">Fraud</a>
    <a href="capella-admin-pending-transfers.html">Pending Transfers</a>
    <a href="capella-admin-affiliate-conversions.html">Affiliate Sales</a>
    <a href="capella-admin-referral-payouts.html">Referrals</a>
    <a href="capella-admin-finance.html">Finance</a>
    <a href="capella-admin-reports.html">Reports</a>
    <a href="capella-admin-settings.html">Settings</a>
  </aside>
  <main class="main">
    <h1>Dashboard</h1>
    <div class="sub">Platform overview and pending items needing your attention.</div>
    <div class="grid" id="statsGrid">
      <div class="card"><div class="label">Loading…</div></div>
    </div>
  </main>
</div>

<script>
  const API_BASE = "https://capella-api-5c6c.drthankgod08.workers.dev";

  async function apiFetch(path, options = {}) {
    const res = await fetch(API_BASE + path, {
      ...options,
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + localStorage.getItem("capella_token"), ...(options.headers || {}) },
    });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  }

  async function init() {
    const token = localStorage.getItem("capella_token");
    if (!token) { window.location.href = "capella-login.html"; return; }

    const { ok, data, status } = await apiFetch("/admin/dashboard");
    const grid = document.getElementById("statsGrid");

    if (!ok) {
      if (status === 403) { grid.innerHTML = '<div class="empty">Admin access required for this account.</div>'; }
      else { grid.innerHTML = `<div class="empty">Could not load: ${data.message || ""}</div>`; }
      return;
    }

    grid.innerHTML = `
      <div class="card"><div class="label">Total Users</div><div class="value">${data.userCount}</div></div>
      <div class="card"><div class="label">Active Campaigns</div><div class="value">${data.activeCampaigns}</div></div>
      <div class="card warn"><div class="label">Submissions Needing Review</div><div class="value">${data.needsReviewSubmissions}</div><a class="link" href="capella-admin-campaigns.html">Review →</a></div>
      <div class="card warn"><div class="label">Open Disputes</div><div class="value">${data.openDisputes}</div><a class="link" href="capella-admin-disputes.html">Review →</a></div>
      <div class="card warn"><div class="label">OTP-Pending Transfers</div><div class="value">${data.otpPendingTransfers}</div><a class="link" href="capella-admin-pending-transfers.html">Review →</a></div>
      <div class="card warn"><div class="label">KYC Pending</div><div class="value">${data.kycPending}</div><a class="link" href="capella-admin-verification.html">Review →</a></div>
    `;
  }

  init();
</script>

</body>
</html>
