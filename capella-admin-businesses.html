<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capella Admin — Businesses</title>
<style>
  :root{--primary:#0B5CFF;--secondary:#0E2A6B;--accent:#F5B301;--bg:#F8FAFF;--card:#fff;--line:#E6EAF2;--text:#1B2559;--muted:#6B7590;--green:#16A34A;--red:#DC2626;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);}
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:220px;background:var(--secondary);color:#fff;padding:18px 12px;flex-shrink:0;}
  .sidebar h2{font-size:15px;padding:0 8px 16px;}
  .sidebar a{display:block;padding:9px 12px;border-radius:8px;color:#C4CDE8;text-decoration:none;font-size:13px;font-weight:600;margin-bottom:2px;}
  .sidebar a.active,.sidebar a:hover{background:var(--primary);color:#fff;}
  .main{flex:1;padding:24px 30px;min-width:0;}
  h1{font-size:20px;margin-bottom:4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;padding:8px;border-bottom:1px solid var(--line);}
  td{padding:10px 8px;font-size:13px;border-bottom:1px solid var(--line);}
  .table-wrap{overflow-x:auto;}
  .empty{color:var(--muted);text-align:center;padding:30px;}
  @media(max-width:800px){.sidebar{display:none;}.main{padding:16px;}}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <h2>Capella Admin</h2>
    <a href="capella-admin-dashboard.html">Dashboard</a>
    <a href="capella-admin-users.html">Users</a>
    <a class="active" href="capella-admin-businesses.html">Businesses</a>
    <a href="capella-admin-campaigns.html">Campaigns</a>
    <a href="capella-admin-pricing.html">Task Pricing</a>
    <a href="capella-admin-disputes.html">Disputes</a>
    <a href="capella-admin-verification.html">Verification</a>
    <a href="capella-admin-fraud.html">Fraud</a>
    <a href="capella-admin-pending-transfers.html">Pending Transfers</a>
    <a href="capella-admin-affiliate-conversions.html">Affiliate Sales</a>
    <a href="capella-admin-referral-payouts.html">Referrals</a>
    <a href="capella-admin-finance.html">Finance</a>
    <a href="capella-admin-reports.html">Reports</a>
    <a href="capella-admin-settings.html">Settings</a>
  </aside>
  <main class="main">
    <h1>Businesses</h1>
    <div class="sub">Every registered business and its wallet balances.</div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Available</th><th>Reserved</th><th>Status</th><th>Joined</th></tr></thead>
          <tbody id="body"><tr><td colspan="6"><div class="empty">Loading…</div></td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
  const API_BASE = "https://capella-api-5c6c.drthankgod08.workers.dev";
  function escapeHtml(str) { return String(str || "").replace(/[&<>"']/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s])); }
  function nairaFmt(n) { return "₦" + Number(n || 0).toLocaleString(); }
  function formatDate(iso) { return iso ? new Date(iso).toLocaleDateString() : "—"; }

  async function init() {
    const token = localStorage.getItem("capella_token");
    if (!token) { window.location.href = "capella-login.html"; return; }

    const res = await fetch(API_BASE + "/admin/businesses", { headers: { Authorization: "Bearer " + token } });
    const data = await res.json();
    const body = document.getElementById("body");

    if (!res.ok) { body.innerHTML = `<tr><td colspan="6"><div class="empty">${res.status === 403 ? "Admin access required." : (data.message || "Could not load.")}</div></td></tr>`; return; }

    const businesses = data.businesses || [];
    if (businesses.length === 0) { body.innerHTML = '<tr><td colspan="6"><div class="empty">No businesses yet.</div></td></tr>'; return; }

    body.innerHTML = businesses.map(b => `
      <tr>
        <td>${escapeHtml(b.name || "—")}</td>
        <td>${escapeHtml(b.email || "—")}</td>
        <td>${nairaFmt(b.availableBalance)}</td>
        <td>${nairaFmt(b.reservedFunds)}</td>
        <td>${escapeHtml(b.status || "—")}</td>
        <td>${formatDate(b.createdAt)}</td>
      </tr>
    `).join("");
  }

  init();
</script>

</body>
</html>
