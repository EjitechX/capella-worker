<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qapela Admin — Users</title>
<style>
  :root{--primary:#0B5CFF;--secondary:#0E2A6B;--accent:#F5B301;--bg:#F8FAFF;--card:#fff;--line:#E6EAF2;--text:#1B2559;--muted:#6B7590;--green:#16A34A;--red:#DC2626;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);}
  .shell{display:flex;min-height:100vh;}
  .sidebar{width:220px;background:var(--secondary);color:#fff;padding:18px 12px;flex-shrink:0;}
  .sidebar h2{font-size:15px;padding:0 8px 16px;}
  .sidebar a{display:block;padding:9px 12px;border-radius:8px;color:#C4CDE8;text-decoration:none;font-size:13px;font-weight:600;margin-bottom:2px;}
  .sidebar a.active,.sidebar a:hover{background:var(--primary);color:#fff;}
  .main{flex:1;padding:24px 30px;min-width:0;}
  h1{font-size:20px;margin-bottom:4px;}
  .sub{color:var(--muted);font-size:13px;margin-bottom:20px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;}
  input.search{width:100%;max-width:320px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;margin-bottom:14px;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;padding:8px;border-bottom:1px solid var(--line);}
  td{padding:10px 8px;font-size:13px;border-bottom:1px solid var(--line);}
  .table-wrap{overflow-x:auto;}
  .badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:20px;}
  .badge.active{background:rgba(22,163,74,.12);color:var(--green);}
  .badge.suspended{background:#FEF3C7;color:#92400E;}
  .badge.banned{background:rgba(220,38,38,.1);color:var(--red);}
  select.status-select{padding:5px 8px;border-radius:6px;border:1px solid var(--line);font-size:12px;}
  .empty{color:var(--muted);text-align:center;padding:30px;}
  @media(max-width:800px){.sidebar{display:none;}.main{padding:16px;}}
  .qapela-admin-brand{display:flex;align-items:center;gap:9px;}
  .qapela-admin-brand img{width:32px;height:32px;object-fit:contain;display:block;flex-shrink:0;}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <h2 class="qapela-admin-brand"><img src="assets/qapela-logo-icon.png" alt="Qapela"><span>Qapela Admin</span></h2>
    <a href="qapela-admin-dashboard.html">Dashboard</a>
    <a class="active" href="qapela-admin-users.html">Users</a>
    <a href="qapela-admin-businesses.html">Businesses</a>
    <a href="qapela-admin-campaigns.html">Campaigns</a>
    <a href="qapela-admin-pricing.html">Task Pricing</a>
    <a href="qapela-admin-disputes.html">Disputes</a>
    <a href="qapela-admin-verification.html">Verification</a>
    <a href="qapela-admin-fraud.html">Fraud</a>
    <a href="qapela-admin-pending-transfers.html">Pending Transfers</a>
    <a href="qapela-admin-affiliate-conversions.html">Affiliate Sales</a>
    <a href="qapela-admin-referral-payouts.html">Referrals</a>
    <a href="qapela-admin-finance.html">Finance</a>
    <a href="qapela-admin-reports.html">Reports</a>
    <a href="qapela-admin-settings.html">Settings</a>
  </aside>
  <main class="main">
    <h1>Users</h1>
    <div class="sub">All registered accounts. Suspend or ban as needed.</div>
    <div class="card">
      <input class="search" id="searchBox" placeholder="Search by name or email…">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Roles</th><th>Activated</th><th>Status</th><th>Joined</th><th>Action</th></tr></thead>
          <tbody id="usersBody"><tr><td colspan="7"><div class="empty">Loading…</div></td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
  const API_BASE = "https://capella-api-5c6c.drthankgod08.workers.dev";
  let allUsers = [];

  async function apiFetch(path, options = {}) {
    const res = await fetch(API_BASE + path, {
      ...options,
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + localStorage.getItem("qapela_token"), ...(options.headers || {}) },
    });
    const data = await res.json().catch(() => ({}));
    return { ok: res.ok, status: res.status, data };
  }
  function escapeHtml(str) { return String(str || "").replace(/[&<>"']/g, s => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s])); }
  function formatDate(iso) { return iso ? new Date(iso).toLocaleDateString() : "—"; }

  async function init() {
    const token = localStorage.getItem("qapela_token");
    if (!token) { window.location.href = "qapela-login.html"; return; }
    load();
    document.getElementById("searchBox").addEventListener("input", render);
  }

  async function load() {
    const { ok, data, status } = await apiFetch("/admin/users");
    const body = document.getElementById("usersBody");
    if (!ok) {
      body.innerHTML = `<tr><td colspan="7"><div class="empty">${status === 403 ? "Admin access required." : (data.message || "Could not load.")}</div></td></tr>`;
      return;
    }
    allUsers = data.users || [];
    render();
  }

  function render() {
    const q = document.getElementById("searchBox").value.trim().toLowerCase();
    const filtered = allUsers.filter(u => !q || (u.displayName || "").toLowerCase().includes(q) || (u.email || "").toLowerCase().includes(q));
    const body = document.getElementById("usersBody");

    if (filtered.length === 0) { body.innerHTML = '<tr><td colspan="7"><div class="empty">No users found.</div></td></tr>'; return; }

    body.innerHTML = filtered.map(u => {
      const roles = [u.roleWorker ? "Worker" : null, u.roleBusiness ? "Business" : null].filter(Boolean).join(", ") || "—";
      return `
        <tr>
          <td>${escapeHtml(u.displayName || "—")}</td>
          <td>${escapeHtml(u.email || u.phone || "—")}</td>
          <td>${roles}</td>
          <td>${u.accountActivated ? "Yes" : "No"}</td>
          <td><span class="badge ${u.status}">${escapeHtml(u.status)}</span></td>
          <td>${formatDate(u.createdAt)}</td>
          <td>
            <select class="status-select" onchange="changeStatus('${u.uid}', this.value)">
              <option value="">Change status…</option>
              <option value="active">Active</option>
              <option value="suspended">Suspend</option>
              <option value="banned">Ban</option>
            </select>
          </td>
        </tr>
      `;
    }).join("");
  }

  window.changeStatus = async function (uid, status) {
    if (!status) return;
    if (!confirm(`Set this user's status to "${status}"?`)) { load(); return; }
    const { ok, data } = await apiFetch(`/admin/users/${uid}/status`, { method: "POST", body: JSON.stringify({ status }) });
    if (ok && data.success) load();
    else alert("Could not update: " + (data.message || ""));
  };

  init();
</script>

</body>
</html>
